# Publishes to npm when a version tag (v0.1.1) is pushed: npm trusted publishing, which adds
# provenance by itself, so no npm token lives here. On npmjs, the package's trusted publisher is this
# repository and this workflow file.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # A tag for a version already on npm (0.1.0 was published by hand) is left alone.
      - name: Publish
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "This version is already on npm"
          else
            npm publish --access public
          fi
